<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<button onclick="location.href='/'">Atrás</button>

<mi-navbar></mi-navbar>
<br>
<mi-navbar espejo></mi-navbar>

<script>
class MiNavbar extends HTMLElement {
  connectedCallback() {
    const estilo = this.hasAttribute('espejo') ? 'transform:scaleX(-1)' : ''
    this.innerHTML = `
      <nav class="navbar navbar-expand navbar-dark bg-dark px-3" style="${estilo}">
        <a class="navbar-brand" href="#">Navbar</a>
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
        </ul>
        <form class="d-flex">
          <input class="form-control me-2" placeholder="Search">
          <button class="btn btn-outline-info" type="button">Search</button>
        </form>
      </nav>
    `
  }
}

customElements.define('mi-navbar', MiNavbar)
</script>

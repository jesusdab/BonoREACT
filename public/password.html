<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container mt-4" style="max-width:480px">
  <button class="btn btn-secondary btn-sm" onclick="location.href='/'">Atrás</button>
  <h2 class="mt-3">Generador de contraseñas</h2>

  <div class="form-check form-switch mb-3">
    <input type="checkbox" id="auto" class="form-check-input" checked onchange="cambiarModo()">
    <label class="form-check-label" for="auto">Generar automáticamente</label>
  </div>

  <div class="input-group mb-1">
    <input id="salida" class="form-control" readonly>
    <button class="btn btn-primary" onclick="copiar()">Copiar</button>
  </div>
  <p id="fuerza" class="fw-bold mb-1"></p>
  <p id="aviso" class="text-success"></p>

  <button id="btnGenerar" class="btn btn-success mb-3" style="display:none" onclick="generar()">Generar</button>

  <label class="form-label">Largo: <span id="num">12</span></label>
  <input type="range" id="largo" class="form-range" min="4" max="32" value="12" oninput="cambio()">

  <div class="form-check">
    <input type="checkbox" id="mayus" class="form-check-input" checked onchange="cambio()">
    <label class="form-check-label" for="mayus">Mayúsculas</label>
  </div>
  <div class="form-check">
    <input type="checkbox" id="minus" class="form-check-input" checked onchange="cambio()">
    <label class="form-check-label" for="minus">Minúsculas</label>
  </div>
  <div class="form-check">
    <input type="checkbox" id="nums" class="form-check-input" checked onchange="cambio()">
    <label class="form-check-label" for="nums">Números</label>
  </div>
  <div class="form-check">
    <input type="checkbox" id="esp" class="form-check-input" onchange="cambio()">
    <label class="form-check-label" for="esp">Caracteres especiales</label>
  </div>
</div>

<script>
const letras = {
  mayus: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  minus: 'abcdefghijklmnopqrstuvwxyz',
  nums: '0123456789',
  esp: '!@#$%^&*()-_=+'
}

function cambio() {
  document.getElementById('num').textContent = document.getElementById('largo').value
  if (document.getElementById('auto').checked) generar()
}

function cambiarModo() {
  const auto = document.getElementById('auto').checked
  document.getElementById('btnGenerar').style.display = auto ? 'none' : 'inline-block'
  if (auto) generar()
}

function generar() {
  const largo = Number(document.getElementById('largo').value)
  document.getElementById('aviso').textContent = ''

  let chars = ''
  let tipos = 0
  for (const k in letras) {
    if (document.getElementById(k).checked) {
      chars += letras[k]
      tipos++
    }
  }

  let texto = ''
  if (chars !== '') {
    for (let j = 0; j < largo; j++) {
      texto += chars[Math.floor(Math.random() * chars.length)]
    }
  }
  document.getElementById('salida').value = texto

  let fuerza = 'Débil'
  if (largo >= 14 && tipos >= 3) fuerza = 'Fuerte'
  else if (largo >= 8 && tipos >= 2) fuerza = 'Media'
  document.getElementById('fuerza').textContent = texto === '' ? '' : fuerza
}

function copiar() {
  const texto = document.getElementById('salida').value
  if (texto === '') return
  navigator.clipboard.writeText(texto)
  document.getElementById('aviso').textContent = 'Copiada al portapapeles'
}

generar()
</script>
